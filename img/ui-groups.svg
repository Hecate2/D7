<svg viewBox="0 0 250 540" width="500" height="1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" role="img">
<title>照片组管理界面</title>
<desc>照片组管理草图：一窗一组一卡片。每张卡片显示组名、冬至结论，以及外部建筑区与天花板区的点数与状态。点卡片进结果，长按改名或删除，右上加号新建一组。</desc>
