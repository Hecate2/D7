<svg viewBox="0 0 680 650" width="680" height="650" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" role="img">
<title>太阳路径与天际线原理示意</title>
<desc>极坐标图，圆心为天顶，外圈为地平线，角向为方位角。北京纬度的夏至、春分秋分、冬至太阳弧线，蓝色为冬至，红色为春分秋分，橙色为夏至。南侧楼群天际线中间有一条空隙，冬至午后太阳穿过空隙约一小时。</desc>
<text x="40" y="32" font-size="14" font-weight="500" fill="#2C2C2A">原理示意：北京 39.9°N，南侧楼群之间有空隙</text>
<text x="40" y="52" font-size="12" fill="#888780">圆心=天顶（仰角90°），外圈=地平线（仰角0°）。角向=方位角，正北 0° 顺时针。</text>
